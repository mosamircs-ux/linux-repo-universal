# AetherOS Wayfire Wayland Compositor Configuration
# /etc/wayfire/wayfire.ini

[core]
plugins = autostart alpha animate autostart command cube expo fast-switcher grid idle move resize session vswitch window-rules wm-actions zoom
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_change_timeout = 0
vwidth = 4
vheight = 1

[autostart]
0_environment = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=AetherOS
1_polkit = /usr/libexec/polkit-gnome-authentication-agent-1
2_pipewire = pipewire
3_wireplumber = wireplumber
4_pipewire_pulse = pipewire-pulse
5_dock = python3 /usr/lib/aether/shell/dock.py
6_topbar = python3 /usr/lib/aether/shell/topbar.py
7_notif = python3 /usr/lib/aether/shell/notifications.py
8_wallpaper = swaybg -i /usr/share/backgrounds/aether/wallpaper-solstice-dark.svg -m fill

[command]
binding_terminal = <super> KEY_T
command_terminal = aether-terminal || x-terminal-emulator
binding_launcher = <super> KEY_A | <super> KEY_SUPER
command_launcher = python3 /usr/lib/aether/shell/launcher.py
binding_filemanager = <super> KEY_E
command_filemanager = thunar || nautilus
binding_settings = <super> KEY_I
command_settings = aether-settings
binding_screenshot = KEY_PRINT
command_screenshot = grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
binding_lock = <super> KEY_L
command_lock = swaylock -f -c 0B0F19

[animate]
open_animation = zoom
close_animation = zoom
duration = 200
fade_duration = 150

[grid]
duration = 180
snap_threshold = 10
type = crossfade
# Ubuntu-style Window Snapping:
# Super+Left: Tile Left, Super+Right: Tile Right, Super+Up: Maximize
key_toggle_maximize = <super> KEY_UP
key_snap_left = <super> KEY_LEFT
key_snap_right = <super> KEY_RIGHT

[idle]
toggle = <super> KEY_Z
screensaver_timeout = 600
dpms_timeout = 900
