# AetherOS Primary Wayland Compositor Configuration (Wayfire)
# /etc/wayfire/wayfire.ini
# High performance, GPU-accelerated, Ubuntu-familiar ergonomics with an original visual identity.

[core]
plugins = autostart alpha animate command cube expo fast-switcher grid idle move resize session vswitch window-rules wm-actions zoom scale vswipe
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_change_timeout = 0
vwidth = 4
vheight = 1
preferred_decoration_mode = server

[autostart]
0_environment = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=AetherOS
1_polkit = /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
2_pipewire = pipewire
3_wireplumber = wireplumber
4_pipewire_pulse = pipewire-pulse
5_dock = python3 /usr/lib/aether/shell/dock.py
6_topbar = python3 /usr/lib/aether/shell/topbar.py
7_notif = python3 /usr/lib/aether/shell/notifications.py
8_wallpaper = swaybg -i /usr/share/backgrounds/aether/wallpaper-solstice-dark.svg -m fill
9_idle = swayidle -w timeout 600 'swaylock -f -c 0B0F19' timeout 900 'wayland-dpms off' resume 'wayland-dpms on'

[command]
# Applications & Utilities
binding_launcher = <super> KEY_A | <super> KEY_SUPER
command_launcher = python3 /usr/lib/aether/shell/launcher.py
binding_terminal = <super> KEY_T
command_terminal = aether-terminal || foot || x-terminal-emulator
binding_filemanager = <super> KEY_E
command_filemanager = thunar || nautilus
binding_settings = <super> KEY_I
command_settings = aether-settings
binding_quicksettings = <super> KEY_S
command_quicksettings = python3 /usr/lib/aether/shell/quicksettings.py
binding_screenshot = KEY_PRINT
command_screenshot = grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot_$(date +'%Y%m%d_%H%M%S').png
binding_fullscreen_screenshot = <shift> KEY_PRINT
command_fullscreen_screenshot = grim ~/Pictures/Screenshots/screenshot_$(date +'%Y%m%d_%H%M%S').png

# Session Management
binding_lock = <super> KEY_L
command_lock = swaylock -f -c 0B0F19 --indicator-radius 100 --ring-color 00D2FF --key-hl-color 6366F1
binding_logout = <super> <shift> KEY_E
command_logout = aether-session --logout

# Window Snapping (Ubuntu Ergonomics)
[grid]
duration = 160
snap_threshold = 10
type = crossfade
key_toggle_maximize = <super> KEY_UP
key_snap_left = <super> KEY_LEFT
key_snap_right = <super> KEY_RIGHT
key_restore = <super> KEY_DOWN

# Workspaces & Pager
[vswitch]
binding_left = <super> <ctrl> KEY_LEFT
binding_right = <super> <ctrl> KEY_RIGHT
duration = 180

[expo]
toggle = <super> KEY_W | <super> KEY_TAB
duration = 200
offset = 10

# Touchpad Gestures
[vswipe]
fingers = 3
gap = 32.0
threshold = 0.35
delta_threshold = 24.0
duration = 200
enable_horizontal = true
enable_vertical = true

[scale]
toggle = <super> KEY_V
duration = 180

# Window Animations (Optimized for zero CPU overhead)
[animate]
open_animation = zoom
close_animation = zoom
duration = 180
fade_duration = 140

[fast-switcher]
activate = <alt> KEY_TAB

[idle]
toggle = <super> KEY_Z
screensaver_timeout = 600
dpms_timeout = 900

# Multi-monitor default scaling
[output:eDP-1]
mode = auto
position = 0,0
scale = 1.0

[output:HDMI-A-1]
mode = auto
position = auto
scale = 1.0

[output:DP-1]
mode = auto
position = auto
scale = 1.0
