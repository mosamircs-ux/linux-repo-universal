# AetherOS Default Kernel Command Line Parameters
# Clean, fast, flicker-free boot into graphical desktop

BOOT_IMAGE=/vmlinuz-linux root=UUID=@ROOT_UUID@ rw rootflags=subvol=@ quiet splash loglevel=3 rd.systemd.show_status=auto udev.log_priority=3 zswap.enabled=0 apparmor=1 security=apparmor nowatchdog elevator=none mitigations=auto
