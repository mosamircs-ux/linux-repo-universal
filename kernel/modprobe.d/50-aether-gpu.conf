# AetherOS GPU Performance & Driver Configuration
# /etc/modprobe.d/50-aether-gpu.conf

# Intel Graphics: Enable GuC/HuC firmware submission and fast boot
options i915 enable_guc=3 enable_fbc=1 fastboot=1
options xe enable_display=1

# AMD Radeon Graphics: Enable full power features and display core
options amdgpu ppfeaturemask=0xffffffff audio=1 dc=1 vm_fragment_size=9

# Open-Source Nouveau (NVIDIA): Enable modesetting and performance controls
options nouveau modeset=1
