# AetherOS Audio, Power & Thermal Optimization Configuration
# /etc/modprobe.d/50-aether-power.conf

# Audio codec power saving (sleep after 1 second of inactivity)
options snd_hda_intel power_save=1 power_save_controller=Y
options snd_ac97_codec power_save=1

# Wireless power management
options iwlwifi power_save=1 uapsd_disable=0

# Realtek / Intel PCIe power saving
options r8169 aspm=1
