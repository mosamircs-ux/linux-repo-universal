# AetherOS NVMe and SATA Storage Tuning
# /etc/modprobe.d/50-aether-storage.conf

# NVMe Autonomous Power State Transition (APST)
# default_ps_max_latency_us=0 ensures fastest resume latency and eliminates NVMe controller freezes
options nvme_core default_ps_max_latency_us=0

# USB Storage and UAS (USB Attached SCSI) protocol
options uas
options usb_storage
