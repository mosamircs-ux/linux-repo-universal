# AetherOS Performance & Latency Kernel Optimizations
# Solstice 1.0 LTS

# Memory Management & Swappiness Tuning
# Keep swappiness low to favor RAM responsiveness while allowing zRAM compression
vm.swappiness = 15
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.min_free_kbytes = 65536
vm.page-cluster = 0

# Process Scheduling & Responsiveness
kernel.sched_autogroup_enabled = 1
kernel.sched_migration_cost_ns = 500000

# File System & Inotify (Optimized for modern desktop and IDEs)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# Network Throughput & Low Latency
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# Security Hardening
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
