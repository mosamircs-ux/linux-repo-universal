# AetherOS NetworkManager Configuration
# /etc/NetworkManager/NetworkManager.conf

[main]
plugins=ifupdown,keyfile
dhcp=internal
dns=default
rc-manager=symlink

[ifupdown]
managed=false

[device]
# Enable Wi-Fi MAC address randomization during scanning for enhanced privacy
wifi.scan-rand-mac-address=yes

[connection]
# Enable randomized MAC address per SSID connection profile
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=preserve
