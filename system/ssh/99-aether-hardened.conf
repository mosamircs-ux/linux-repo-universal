# ==============================================================================
# AetherOS Hardened SSH Server Configuration
# Path: /etc/ssh/sshd_config.d/99-aether-hardened.conf
# ==============================================================================

# Authentication & Access
PermitRootLogin no
MaxAuthTries 3
MaxSessions 2
PubkeyAuthentication yes
PasswordAuthentication yes
PermitEmptyPasswords no

# Session Security & Timeouts
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
TCPKeepAlive yes

# Forwarding & Environment Hardening
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitUserEnvironment no

# Modern Cryptographic Algorithms (Post-Quantum & Curve25519)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
