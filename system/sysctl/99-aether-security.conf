# ==============================================================================
# AetherOS System Security & Kernel Hardening Configuration
# Path: /etc/sysctl.d/99-aether-security.conf
# ==============================================================================

# 1. Address Space Layout Randomization (ASLR)
# 2 = Full randomization of stack, VDSO, heap, and mmap base
kernel.randomize_va_space = 2

# 2. Process Tracing (Yama LSM)
# 1 = Restricted ptrace (only direct ancestors can ptrace child processes)
kernel.yama.ptrace_scope = 1

# 3. Kernel Symbol & Pointer Protection
# 2 = Hide kernel symbols and addresses from unprivileged users
kernel.kptr_restrict = 2

# 4. Kernel Ring Buffer (dmesg) Protection
# 1 = Unprivileged users cannot read dmesg output
kernel.dmesg_restrict = 1

# 5. eBPF Subsystem Hardening
# 1 = Disable unprivileged BPF program loading
kernel.unprivileged_bpf_disabled = 1
# 2 = Enable constant blinding for all BPF JIT programs
net.core.bpf_jit_harden = 2

# 6. Core Dumps & SUID Execution Protection
# 0 = Do not produce core dumps for setuid executables
fs.suid_dumpable = 0

# 7. Symlink, Hardlink, FIFO, and Regular File Protections in Sticky Dirs (/tmp)
# Prevents time-of-check to time-of-use (TOCTOU) symlink attacks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# 8. Network Stack Hardening & Anti-Spoofing
# Enable TCP SYN Cookies to mitigate SYN flood DoS attacks
net.ipv4.tcp_syncookies = 1

# Enable Strict Reverse Path Filtering (Anti-IP Spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP Redirects (prevents routing table tampering)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable Source Packet Routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore ICMP Echo Broadcasts (Smurf attack protection)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Log Martians (packets with impossible addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
