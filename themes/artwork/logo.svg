<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="orbitIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Celestial Orbit Arc 1 (Primary Cyan/Blue) -->
  <path d="M 128 320 C 110 240, 160 140, 256 128 C 352 116, 410 180, 400 270 C 392 340, 320 400, 240 390 C 180 380, 140 330, 150 270" 
        fill="none" stroke="url(#orbitCyan)" stroke-width="26" stroke-linecap="round" filter="url(#neonBloom)"/>

  <!-- Celestial Orbit Arc 2 (Secondary Indigo/Magenta) -->
  <path d="M 384 192 C 402 272, 352 372, 256 384 C 160 396, 102 332, 112 242 C 120 172, 192 112, 272 122" 
        fill="none" stroke="url(#orbitIndigo)" stroke-width="18" stroke-linecap="round" stroke-dasharray="140 18" opacity="0.85"/>

  <!-- Center Celestial Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="14" fill="#00E5FF"/>

  <!-- Luminous Orbit Particles -->
  <circle cx="396" cy="230" r="8" fill="#00F0FF" filter="url(#neonBloom)"/>
  <circle cx="130" cy="290" r="6" fill="#F472B6"/>
  <circle cx="270" cy="122" r="5" fill="#FFFFFF"/>
</svg>
