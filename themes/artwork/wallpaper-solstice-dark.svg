<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="35%" stop-color="#0B0F19"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glowing Waves Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveIndigo" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="nebulaGlow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- Ambient Light Clouds -->
  <circle cx="2600" cy="900" r="1100" fill="url(#nebulaGlow)" filter="url(#blurFilter)"/>
  <circle cx="1100" cy="1400" r="900" fill="#4F46E5" fill-opacity="0.08" filter="url(#blurFilter)"/>

  <!-- Geometric Ribbon Waves -->
  <path d="M -200 1800 C 600 1600, 1200 2000, 2000 1500 C 2800 1000, 3200 1400, 4100 900 L 4100 2300 L -200 2300 Z" 
        fill="url(#waveCyan)" opacity="0.4" filter="url(#blurFilter)"/>

  <path d="M -200 1400 C 800 1200, 1600 1800, 2400 1200 C 3200 600, 3600 1000, 4100 600 L 4100 2300 L -200 2300 Z" 
        fill="url(#waveIndigo)" opacity="0.35" filter="url(#blurFilter)"/>

  <!-- Razor Crisp Vector Arcs -->
  <path d="M -100 1650 C 700 1450, 1400 1850, 2200 1350 C 3000 850, 3400 1250, 4000 750" 
        fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-opacity="0.6"/>

  <path d="M -100 1500 C 850 1300, 1550 1700, 2350 1150 C 3150 650, 3550 1100, 4000 550" 
        fill="none" stroke="#818CF8" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="24 12"/>

  <!-- Minimal Brand Monogram Center-Right -->
  <g transform="translate(3400, 1900) scale(0.35)" opacity="0.3">
    <circle cx="256" cy="256" r="64" fill="#38BDF8"/>
    <path d="M 128 320 C 110 240, 160 140, 256 128 C 352 116, 410 180, 400 270" fill="none" stroke="#00F0FF" stroke-width="24"/>
  </g>
</svg>
