<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default UI Sans-Serif Font: Inter with Cairo/Tajawal Arabic Fallbacks -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Cairo</family>
      <family>Tajawal</family>
      <family>Noto Sans Arabic</family>
      <family>Ubuntu</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Default Serif Font: Amiri / Noto Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Amiri</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- Default Monospace Font: JetBrains Mono / DejaVu Sans Mono -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Fira Code</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Rendering Quality: Subpixel RGB & Crisp Antialiasing -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
